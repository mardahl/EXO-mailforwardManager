name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build release zip
        shell: pwsh
        run: |
          $stage = "EXO-mailforwardManager-${env:GITHUB_REF_NAME}"
          ./scripts/Build-Release.ps1 -OutputDirectory $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > notes.md
          gh release upload "$GITHUB_REF_NAME" EXO-mailforwardManager-*.zip --clobber \
            || gh release create "$GITHUB_REF_NAME" EXO-mailforwardManager-*.zip --notes-file notes.md
