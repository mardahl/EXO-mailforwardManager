name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = @(Invoke-ScriptAnalyzer -Path ./MailboxForwardingTool.ps1 -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error, Warning)
          $results += @(Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error, Warning)
          if ($results.Count -gt 0) {
              $results | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String | Write-Host
              throw "PSScriptAnalyzer reported $($results.Count) finding(s)."
          }
          Write-Host 'PSScriptAnalyzer: clean.'

  test:
    name: Parse + offline tests (Linux, pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse + analyze
        shell: pwsh
        run: |
          $paths = @('./MailboxForwardingTool.ps1') + @(Get-ChildItem ./src -Filter '*.ps1' | Select-Object -ExpandProperty FullName)
          foreach ($path in $paths) {
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
              if ($errors.Count) { $errors | Write-Host; throw "Parse errors in ${path}." }
          }
          Write-Host 'Parse OK.'
      - name: Run each test suite in a fresh process
        shell: pwsh
        run: |
          $engine = (Get-Process -Id $PID).Path
          foreach ($test in (Get-ChildItem ./tests -Filter '*.Tests.ps1' | Sort-Object Name)) {
              Write-Host "--- $($test.Name) ---"
              & $engine -NoProfile -File $test.FullName
              if ($LASTEXITCODE -ne 0) { throw "Failed: $($test.Name)" }
          }

  windows-powershell-test:
    name: Parse + offline tests (Windows, powershell.exe 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse + analyze
        shell: powershell
        run: |
          $paths = @('./MailboxForwardingTool.ps1') + @(Get-ChildItem ./src -Filter '*.ps1' | Select-Object -ExpandProperty FullName)
          foreach ($path in $paths) {
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
              if ($errors.Count) { $errors | Write-Host; throw "Parse errors in ${path}." }
          }
          Write-Host 'Parse OK.'
      - name: Run each test suite in a fresh process
        shell: powershell
        run: |
          $engine = (Get-Process -Id $PID).Path
          foreach ($test in (Get-ChildItem ./tests -Filter '*.Tests.ps1' | Sort-Object Name)) {
              Write-Host "--- $($test.Name) ---"
              & $engine -NoProfile -File $test.FullName
              if ($LASTEXITCODE -ne 0) { throw "Failed: $($test.Name)" }
          }

  windows-pwsh-test:
    name: Parse + offline tests (Windows, pwsh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse + analyze
        shell: pwsh
        run: |
          $paths = @('./MailboxForwardingTool.ps1') + @(Get-ChildItem ./src -Filter '*.ps1' | Select-Object -ExpandProperty FullName)
          foreach ($path in $paths) {
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
              if ($errors.Count) { $errors | Write-Host; throw "Parse errors in ${path}." }
          }
          Write-Host 'Parse OK.'
      - name: Run each test suite in a fresh process
        shell: pwsh
        run: |
          $engine = (Get-Process -Id $PID).Path
          foreach ($test in (Get-ChildItem ./tests -Filter '*.Tests.ps1' | Sort-Object Name)) {
              Write-Host "--- $($test.Name) ---"
              & $engine -NoProfile -File $test.FullName
              if ($LASTEXITCODE -ne 0) { throw "Failed: $($test.Name)" }
          }
